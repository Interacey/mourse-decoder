# CI: Rust and Python tests on Windows (the target platform) and Linux.
# Windows is what proves rdev, enigo and PyO3 build there.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: X11 headers (Linux only, for rdev/enigo) and xvfb (display for the Tk tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev libxi-dev xvfb

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Rust - format, lints, tests
        run: |
          cargo fmt --check
          cargo clippy --all-targets --features python,pyo3/extension-module -- -D warnings
          cargo test

      - name: Python - build the module and test
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then source .venv/Scripts/activate; else source .venv/bin/activate; fi
          pip install maturin pytest ruff
          maturin develop --release
          ruff check python tests
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a pytest -q; else pytest -q; fi

      # builds an MSI around a placeholder file (WiX does not look inside the exe), so a broken .wxs fails on every push
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        if: runner.os == 'Windows' && matrix.python == '3.13'
        with:
          dotnet-version: 8.0.x

      - name: MSI - build and validate
        if: runner.os == 'Windows' && matrix.python == '3.13'
        shell: bash
        run: |
          source .venv/Scripts/activate
          dotnet tool install --global wix --version 5.0.2
          export PATH="$PATH:$HOME/.dotnet/tools"
          python -c "import sys; sys.path.insert(0, 'packaging'); import build; build.make_icon()"
          echo "placeholder, not a PE file" > "$RUNNER_TEMP/MourseDecoder.exe"
          python packaging/build_msi.py --exe "$RUNNER_TEMP/MourseDecoder.exe" --output "$RUNNER_TEMP/MourseDecoder.msi"
