# Builds MourseDecoder.exe and MourseDecoder.msi and attaches them to a GitHub release.
#
# Publish a release by pushing a version tag:
#   git tag v.0.1.2 && git push origin v.0.1.2
# The tag must match the version in Cargo.toml, pyproject.toml and python/mourse_decoder/__init__.py,
# and the tests must pass. It can also be started by hand from the Actions tab (the exe is then
# only an artifact). Actions are pinned by commit SHA (the tag is in the comment).
# The release is created as a DRAFT. The signing key is never in GitHub: the maintainer signs the exe
# offline and uploads MourseDecoder.exe.sig and MourseDecoder.msi.sig before publishing (see
# packaging/RELEASING.md).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Tag matches the version files
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          python - <<'PY'
          import os, re, sys
          tag = os.environ["GITHUB_REF_NAME"]
          tag = re.sub(r"^v\.?", "", tag)
          def first(path, pattern):
              # utf-8-sig: Cargo.toml starts with a BOM; the first match is the package's own version
              return re.search(pattern, open(path, encoding="utf-8-sig").read(), re.M)[1]
          found = {
              "Cargo.toml": first("Cargo.toml", r'^version\s*=\s*"([^"]+)"'),
              "pyproject.toml": first("pyproject.toml", r'^version\s*=\s*"([^"]+)"'),
              "__init__.py": first("python/mourse_decoder/__init__.py", r'^__version__\s*=\s*"([^"]+)"'),
          }
          print("tag:", tag, found)
          bad = {name: v for name, v in found.items() if v != tag}
          if bad:
              sys.exit(f"Tag {tag} differs from: {bad}")
          PY

      - name: Rust - format, lints, tests
        run: |
          cargo fmt --check
          cargo clippy --all-targets --features python,pyo3/extension-module -- -D warnings
          cargo test

      - name: Python - build the module and test
        shell: bash
        run: |
          python -m venv .venv
          source .venv/Scripts/activate
          pip install -r requirements-build.txt
          maturin develop --release
          ruff check python tests
          pytest -q

  windows-exe:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write # only this job publishes the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Build the native module
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -r requirements-build.txt
          .venv\Scripts\maturin develop --release

      - name: A release needs a pinned update key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PYTHONPATH: python
        run: .venv\Scripts\python -c "from mourse_decoder.signing import PINNED_PUBLIC_KEYS; assert PINNED_PUBLIC_KEYS, 'no pinned update key'"

      - name: Build the exe
        run: .venv\Scripts\python packaging\build.py

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 8.0.x

      # WiX 5.0.2 is the last major version without an EULA acceptance; do not move it to 6 or 7
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Build the MSI
        run: .venv\Scripts\python packaging\build_msi.py

      # per-user install, upgrade and uninstall of the MSI that is about to be released
      - name: Smoke test the MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\MourseDecoder'
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Mourse Decoder.lnk'
          $regKey = 'HKCU:\Software\Interacey\MourseDecoder'
          # from an elevated session Windows Installer lists a per-user package under HKLM, otherwise under HKCU
          $uninstallRoots = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
                            'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall'
          $dataDir = Join-Path $env:APPDATA 'MourseDecoder'
          $logDir = New-Item -ItemType Directory -Force dist\msi-logs
          $msi = (Resolve-Path dist\MourseDecoder.msi).Path

          function Invoke-Msi($switch, $package, $name) {
            $log = Join-Path $logDir "$name.log"
            $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList "$switch `"$package`" /qn /norestart /l*v `"$log`""
            if ($process.ExitCode -ne 0) { throw "msiexec $switch $name exited with $($process.ExitCode)" }
          }
          function Get-Entries {
            @(Get-ChildItem $uninstallRoots | Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -eq 'Mourse Decoder' })
          }
          function Assert($condition, $message) { if (-not $condition) { throw "MSI smoke test: $message" } }

          # user data must survive install, upgrade and uninstall
          New-Item -ItemType Directory -Force $dataDir | Out-Null
          $marker = Join-Path $dataDir 'msi-smoke-test.txt'
          'keep' | Out-File $marker -Encoding ascii

          Assert (@(Get-Entries).Count -eq 0) 'Mourse Decoder is installed before the test'
          Invoke-Msi '/i' $msi 'install'
          Assert (Test-Path (Join-Path $installDir 'MourseDecoder.exe')) 'exe missing after install'
          Assert (Test-Path $shortcut) 'Start menu shortcut missing after install'
          $entries = Get-Entries
          Assert ($entries.Count -eq 1) "expected 1 uninstall entry after install, found $($entries.Count)"
          $values = Get-ItemProperty $regKey
          Assert ($values.InstallDir -eq "$installDir\") "InstallDir is '$($values.InstallDir)'"
          Assert ($values.ProductCode -eq $entries[0].PSChildName) "ProductCode is '$($values.ProductCode)', uninstall key is '$($entries[0].PSChildName)'"
          $oldVersion = (Get-ItemProperty $entries[0].PSPath).DisplayVersion

          # a higher version over the first one: one entry, new version
          $upgrade = 'build\MourseDecoder-9.9.9.msi'
          .venv\Scripts\python packaging\build_msi.py --version 9.9.9 --output $upgrade
          if ($LASTEXITCODE -ne 0) { throw "building the upgrade MSI failed ($LASTEXITCODE)" }
          $upgrade = (Resolve-Path $upgrade).Path
          Invoke-Msi '/i' $upgrade 'upgrade'
          $entries = Get-Entries
          Assert ($entries.Count -eq 1) "expected 1 uninstall entry after upgrade, found $($entries.Count)"
          $newVersion = (Get-ItemProperty $entries[0].PSPath).DisplayVersion
          Assert ($newVersion -eq '9.9.9') "version after upgrade is '$newVersion' (was '$oldVersion')"
          Assert (Test-Path (Join-Path $installDir 'MourseDecoder.exe')) 'exe missing after upgrade'
          Assert ((Get-ItemProperty $regKey).ProductCode -eq $entries[0].PSChildName) 'ProductCode not updated by the upgrade'

          Invoke-Msi '/x' $upgrade 'uninstall'
          Assert (@(Get-Entries).Count -eq 0) 'uninstall entry remains after uninstall'
          Assert (-not (Test-Path (Join-Path $installDir 'MourseDecoder.exe'))) 'exe remains after uninstall'
          Assert (-not (Test-Path $installDir)) 'install folder remains after uninstall'
          Assert (-not (Test-Path $shortcut)) 'Start menu shortcut remains after uninstall'
          Assert (-not (Test-Path $regKey)) 'registry key remains after uninstall'
          Assert (Test-Path $marker) 'user data in %APPDATA%\MourseDecoder was removed'
          Remove-Item $marker

      - name: Upload the MSI logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MourseDecoder-msi-logs
          path: dist/msi-logs/*.log
          if-no-files-found: ignore

      - name: Checksum
        shell: pwsh
        run: |
          foreach ($name in 'MourseDecoder.exe', 'MourseDecoder.msi') {
            $hash = (Get-FileHash "dist\$name" -Algorithm SHA256).Hash.ToLower()
            "$hash  $name" | Out-File "dist\$name.sha256" -Encoding ascii
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MourseDecoder-windows
          path: |
            dist/MourseDecoder.exe
            dist/MourseDecoder.exe.sha256
            dist/MourseDecoder.msi
            dist/MourseDecoder.msi.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/MourseDecoder.exe
            dist/MourseDecoder.exe.sha256
            dist/MourseDecoder.msi
            dist/MourseDecoder.msi.sha256
          generate_release_notes: true
          # stays a draft until the maintainer has signed offline, uploaded MourseDecoder.exe.sig and
          # MourseDecoder.msi.sig and published
          draft: true
