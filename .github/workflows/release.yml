# Builds MourseDecoder.exe and attaches it to a GitHub release.
#
# Publish a release by raising the version (pyproject.toml, Cargo.toml, __init__.py) and
# pushing a matching tag, "v" directly followed by the version:
#   git tag v0.1.1 && git push origin v0.1.1
# It can also be started by hand from the Actions tab (the exe is then only an artifact).
name: Release

on:
  push:
    tags: ["v[0-9]*"]  # "v.0.1.1" doesn't match, so a mistyped tag publishes nothing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # an exe built from a tag must report that version, not the previous one
      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match version $version in pyproject.toml"
          }

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the native module
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install maturin pyinstaller pystray Pillow
          .venv\Scripts\maturin develop --release

      - name: Build the exe
        run: .venv\Scripts\python packaging\build.py

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\MourseDecoder.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  MourseDecoder.exe" | Out-File dist\MourseDecoder.exe.sha256 -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: MourseDecoder-windows
          path: |
            dist/MourseDecoder.exe
            dist/MourseDecoder.exe.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MourseDecoder.exe
            dist/MourseDecoder.exe.sha256
          generate_release_notes: true
