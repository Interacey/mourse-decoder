# Builds MourseDecoder.exe and attaches it to a GitHub release.
#
# Publish a release by pushing a version tag:
#   git tag v.0.1.2 && git push origin v.0.1.2
# The tag must match the version in Cargo.toml, pyproject.toml and python/mourse_decoder/__init__.py,
# and the tests must pass. It can also be started by hand from the Actions tab (the exe is then
# only an artifact). Actions are pinned by commit SHA (the tag is in the comment).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Tag matches the version files
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          python - <<'PY'
          import os, re, sys
          tag = os.environ["GITHUB_REF_NAME"]
          tag = re.sub(r"^v\.?", "", tag)
          def first(path, pattern):
              # utf-8-sig: Cargo.toml starts with a BOM; the first match is the package's own version
              return re.search(pattern, open(path, encoding="utf-8-sig").read(), re.M)[1]
          found = {
              "Cargo.toml": first("Cargo.toml", r'^version\s*=\s*"([^"]+)"'),
              "pyproject.toml": first("pyproject.toml", r'^version\s*=\s*"([^"]+)"'),
              "__init__.py": first("python/mourse_decoder/__init__.py", r'^__version__\s*=\s*"([^"]+)"'),
          }
          print("tag:", tag, found)
          bad = {name: v for name, v in found.items() if v != tag}
          if bad:
              sys.exit(f"Tag {tag} differs from: {bad}")
          PY

      - name: Rust - format, lints, tests
        run: |
          cargo fmt --check
          cargo clippy --all-targets --features python,pyo3/extension-module -- -D warnings
          cargo test

      - name: Python - build the module and test
        shell: bash
        run: |
          python -m venv .venv
          source .venv/Scripts/activate
          pip install -r requirements-build.txt
          maturin develop --release
          ruff check python tests
          pytest -q

  windows-exe:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write # only this job publishes the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Build the native module
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -r requirements-build.txt
          .venv\Scripts\maturin develop --release

      - name: Build the exe
        run: .venv\Scripts\python packaging\build.py

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\MourseDecoder.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  MourseDecoder.exe" | Out-File dist\MourseDecoder.exe.sha256 -Encoding ascii

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MourseDecoder-windows
          path: |
            dist/MourseDecoder.exe
            dist/MourseDecoder.exe.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/MourseDecoder.exe
            dist/MourseDecoder.exe.sha256
          generate_release_notes: true
